name: Aurion CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aurion-main-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Backend tests
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test

      - name: Frontend build
        run: npm run build

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Deploy backend (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_BACKEND_HOST }}
          username: ${{ secrets.VPS_BACKEND_USER }}
          password: ${{ secrets.VPS_BACKEND_PASSWORD }}
          port: ${{ secrets.VPS_BACKEND_PORT }}
          script_stop: true
          script: |
            bash /opt/aurion-mvp/scripts/deploy_vps.sh

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Deploy frontend (VPS)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_FRONTEND_HOST }}
          username: ${{ secrets.VPS_FRONTEND_USER }}
          password: ${{ secrets.VPS_FRONTEND_PASSWORD }}
          port: ${{ secrets.VPS_FRONTEND_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/aurion-mvp
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.vps.yml up -d --build
