name: Deploy Aurion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Run backend smoke tests
        run: pytest -q || true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend
        run: npm run build

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Deploy backend VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_BACKEND_HOST }}
          username: ${{ secrets.VPS_BACKEND_USER }}
          password: ${{ secrets.VPS_BACKEND_PASSWORD }}
          port: ${{ secrets.VPS_BACKEND_PORT }}
          script: |
            bash /opt/aurion-mvp/scripts/deploy_vps.sh

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Deploy frontend VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_FRONTEND_HOST }}
          username: ${{ secrets.VPS_FRONTEND_USER }}
          password: ${{ secrets.VPS_FRONTEND_PASSWORD }}
          port: ${{ secrets.VPS_FRONTEND_PORT }}
          script: |
            cd /opt/aurion-mvp
            git fetch --all --prune
            git checkout main
            git pull --ff-only origin main
            docker compose -f docker-compose.vps.yml up -d --build
