services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      AURION_DB_PATH: /app/data/aurion.db
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
